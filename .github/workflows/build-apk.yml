name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and locate project files
        run: |
          unzip -o remix-maige-photo-ai.zip -d unzipped/
          GRADLEW_PATH=$(find unzipped/ -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project directory at: $PROJECT_DIR"
            cp -r "$PROJECT_DIR"/* .
            cp -r "$PROJECT_DIR"/.[^.]* . 2>/dev/null || true
          else
            echo "Error: gradlew not found inside the ZIP file!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maige-Photo-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
