name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip contents and organize
        run: |
          unzip -o remix-maige-photo-ai.zip -d extracted_files/
          shopt -s dotglob
          if [ -d "extracted_files/remix-maige-photo-ai" ]; then
            cp -r extracted_files/remix-maico-photo-ai/* . 2>/dev/null || true
            cp -r extracted_files/remix-maige-photo-ai/* . 2>/dev/null || true
          fi
          # Fallback kama zip imejificha kwenye folda nyingine yoyote
          FOUND_DIR=$(find extracted_files/ -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$FOUND_DIR" ]; then
            cp -r "$FOUND_DIR"/* . 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maige-Photo-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
